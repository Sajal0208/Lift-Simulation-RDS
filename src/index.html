<body>
    <div class="heading">
        <h1>
            Lift Simulation
        </h1>
        <div class = "configure-container">
            <div class="configure-input">
                <label for="floors">Floors</label>
                <input id="floors" min="1" name="floors" type="number"/>
            </div>
            <button id="start-btn" class="main-btns">
                Let's Go
            </button>
            <button id="reset-btn" class="main-btns">
                Reset
            </button>
            <div class="configure-input">
                <label for="lifts">Lifts</label>
                <input type="number" min="1" id="lifts" name="lifts" />
            </div>
        </div>
    </div>
    <div class="house">
        <h1>
            House
        </h1>

                    </button>
                </div>
            </div> -->

</html>
